<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DH.STREAM</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#04123a;
    color:white;
}

/* Sidebar */

.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:80px;
    height:100vh;

    background:#081a3e;

    border-right:2px solid #00ffff;

    transition:.4s;

    overflow:hidden;
}

/* Expanded */

.sidebar.active{
    width:260px;
}

/* Logo */

.logo{
    height:80px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#00ffff;

    font-size:28px;
    font-weight:bold;

    text-shadow:0 0 15px #00ffff;
}

/* Menu Button */

.toggle{

    position:absolute;

    top:20px;
    right:15px;

    background:none;
    border:none;

    color:white;

    font-size:28px;

    cursor:pointer;
}

/* Links */

.sidebar a{

    display:flex;
    align-items:center;

    gap:15px;

    color:white;
    text-decoration:none;

    padding:20px;

    transition:.3s;
}

.sidebar a:hover{

    background:rgba(0,255,255,.12);

    color:#00ffff;
}

/* Hide labels */

.label{
    opacity:0;
    white-space:nowrap;
    transition:.2s;
}

.sidebar.active .label{
    opacity:1;
}

/* Main */

.main{

    margin-left:80px;
    min-height:100vh;

    display:flex;
    flex-direction:column;
    justify-content:center;

    padding:80px;

    transition:.4s;
}

.main.shift{
    margin-left:260px;
}

.main h1{

    font-size:70px;

    color:#00ffff;

    text-shadow:
    0 0 15px #00ffff,
    0 0 35px #00ffff;
}

.main p{

    margin-top:20px;
    font-size:24px;
}

</style>
</head>
<body>

<div class="sidebar" id="sidebar">

    <div class="logo">


        <button class="toggle" onclick="toggleSidebar()">
            ☰
        </button>
    </div>

    <a href="hi.html">
        <span class="label"> Data page </span>
    </a>

    <a href="#">
 
        <span class="label">Dashboard</span>
    </a>

    <a href="#">
 
        <span class="label">Dashboard</span>
    </a>

 

</div>

<div class="main" id="main">

    <h1>Dharui Dashboard</h1>

    <p>Welcome to learning With Ai </p>

</div>

<script>

function toggleSidebar(){

    document.getElementById("sidebar")
        .classList.toggle("active");

    document.getElementById("main")
        .classList.toggle("shift");
}

</script>

</body>
</html>
