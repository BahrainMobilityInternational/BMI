<!DOCTYPE html>
<html>
<head>
    <title>Procurement Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h2{
            color: #222;
        }

        table{
            border-collapse: collapse;
        }

        td{
            padding: 8px;
        }

        input{
            width: 250px;
            padding: 8px;
        }

        button{
            padding: 10px 15px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover{
            background: darkgreen;
        }
    </style>
</head>
<body>

<h2>Procurement Request</h2>

<table>
    <tr>
        <td>Item Name</td>
        <td><input type="text" id="item"></td>
    </tr>

    <tr>
        <td>USD Price</td>
        <td><input type="number" id="usd"></td>
    </tr>

    <tr>
        <td>VAT %</td>
        <td><input type="number" id="vat" value="10"></td>
    </tr>

    <tr>
        <td>Total USD</td>
        <td><input type="text" id="totalusd" readonly></td>
    </tr>

    <tr>
        <td>Total BHD</td>
        <td><input type="text" id="totalbhd" readonly></td>
    </tr>
</table>

<br>

<button onclick="calculate()">Calculate</button>
<button onclick="saveData()">Save</button>

<script>

function calculate() {

    let usd = Number(document.getElementById("usd").value) || 0;
    let vat = Number(document.getElementById("vat").value) || 0;

    let totalUSD = usd + (usd * vat / 100);
    let totalBHD = totalUSD * 0.376;

    document.getElementById("totalusd").value = totalUSD.toFixed(2);
    document.getElementById("totalbhd").value = totalBHD.toFixed(3);
}

function saveData() {

    calculate();

    const data = {
        item: document.getElementById("item").value,
        usd: document.getElementById("usd").value,
        vat: document.getElementById("vat").value,
        totalUSD: document.getElementById("totalusd").value,
        totalBHD: document.getElementById("totalbhd").value
    };

    fetch("https://script.google.com/macros/s/AKfycbxo5C6MZkuaCOTLi29SbCQM_aURUZ2IW9xGWSsEXBTu038f4ebssnjCgowivTjtOFWOSw/exec", {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(data)
    })
    .then(() => {
        alert("Saved Successfully");
    })
    .catch((error) => {
        alert("Error: " + error);
        console.log(error);
    });

}

</script>

</body>
</html>
