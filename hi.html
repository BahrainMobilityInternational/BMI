<!DOCTYPE html>
<html>
<head>
    <title>Purchase Request Form</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: auto;
            padding: 20px;
        }

        input{
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 12px;
            background: #0078d7;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover{
            background: #005ea6;
        }

        #calculation{
            margin-top: 15px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f8f8;
        }

        .total{
            color: green;
            font-size: 20px;
            font-weight: bold;
        }

        #result{
            margin-top:15px;
            font-weight:bold;
        }
    </style>
</head>

<body>

<h2>Purchase Request Form</h2>

<form id="studentForm">

    <input type="text" id="requester" placeholder="Requester Name" required>

    <input type="text" id="department" placeholder="Department" required>

    <input type="text" id="item" placeholder="Item Name" required>

    <input type="number" id="quantity" placeholder="Quantity" min="1" required>

    <input type="number" id="price" placeholder="Price USD" step="0.01" required>

    <div id="calculation">
        <h3>Live Calculation</h3>

        <p>Subtotal USD: <strong id="subtotal">$0.00</strong></p>
        <p>VAT (10%): <strong id="vat">$0.00</strong></p>
        <p>Total USD: <strong id="totalusd">$0.00</strong></p>

        <p class="total">
            Total BHD:
            <span id="totalbhd">0.000 BHD</span>
        </p>
    </div>

    <br>

    <button type="submit">Save</button>

</form>

<p id="result"></p>

<script>

const VAT_RATE = 0.10;
const USD_TO_BHD = 0.376;

function updateCalculation(){

    const quantity =
        Number(document.getElementById("quantity").value) || 0;

    const price =
        Number(document.getElementById("price").value) || 0;

    const subtotalUSD = quantity * price;
    const vatUSD = subtotalUSD * VAT_RATE;
    const totalUSD = subtotalUSD + vatUSD;
    const totalBHD = totalUSD * USD_TO_BHD;

    document.getElementById("subtotal").innerText =
        "$" + subtotalUSD.toFixed(2);

    document.getElementById("vat").innerText =
        "$" + vatUSD.toFixed(2);

    document.getElementById("totalusd").innerText =
        "$" + totalUSD.toFixed(2);

    document.getElementById("totalbhd").innerText =
        totalBHD.toFixed(3) + " BHD";
}

document.getElementById("quantity")
.addEventListener("input", updateCalculation);

document.getElementById("price")
.addEventListener("input", updateCalculation);

document.getElementById("studentForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    const quantity =
        Number(document.getElementById("quantity").value);

    const price =
        Number(document.getElementById("price").value);

    const subtotalUSD = quantity * price;
    const vatUSD = subtotalUSD * VAT_RATE;
    const totalUSD = subtotalUSD + vatUSD;
    const totalBHD = totalUSD * USD_TO_BHD;

    fetch(
    "https://script.google.com/macros/s/AKfycbyMmexf3ODHld00RbjPCtqgE5tmNHFd-7b4Q63aAFN42YOsNYd4tP0MnTCMh2qXbZ9N/exec",
    {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify({

            requester:
            document.getElementById("requester").value,

            department:
            document.getElementById("department").value,

            item:
            document.getElementById("item").value,

            quantity: quantity,

            price: price,

            subtotalUSD:
            subtotalUSD.toFixed(2),

            vatUSD:
            vatUSD.toFixed(2),

            totalUSD:
            totalUSD.toFixed(2),

            totalBHD:
            totalBHD.toFixed(3)

        })
    })
    .then(() => {

        document.getElementById("result").innerHTML =
            "✅ Submitted Successfully";

        document.getElementById("studentForm").reset();

        updateCalculation();

    })
    .catch(error => {

        document.getElementById("result").innerHTML =
            "❌ Error: " + error;

    });

});

</script>

</body>
</html>
