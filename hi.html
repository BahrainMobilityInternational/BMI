<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
	<style>
    	body{
        	font-family: Arial, sans-serif;
        	margin: 20px;
    	}
    	h2{
        	color: #222;
    	}
    	table{
        	border-collapse: collapse;
    	}
    	td{
        	padding: 8px;
    	}
    	input{
        	width: 250px;

    	button{

<body>

<h2>Procurement Form</h2>
<table>
    <tr>
        <td>Department Name</td>
        <td><input type="text"id=Department></td>
    </tr>
	<tr>
    	<td>Item Name</td>
    	<td><input type="text" id="item"></td>
	</tr>
	<tr>
    	<td>USD Price</td>
    	<td><input type="number" id="usd"></td>
	</tr>
	<tr>
    	<td>VAT %</td>
    	<td><input type="number" id="vat" value="10"></td>
	</tr>
	<tr>
    	<td>Total USD</td>
    	<td><input type="text" id="totalusd" readonly></td>
	</tr>
	<tr>
    	<td>Total BHD</td>
    	<td><input type="text" id="totalbhd" readonly></td>
	</tr>
</table>
<p>
    Hello Here you Can Calculate  
    <br>
     price x VAT% By 10% 
</p>
<br>
<p>

    <button onclick="calculate()">Calculate</button>
    <button onclick="saveData()">Save</button>
    </p>
</form>



<p id="result"></p>

<script>


function calculate() {
	let usd = Number(document.getElementById("usd").value) || 0;
	let vat = Number(document.getElementById("vat").value) || 0;
	let totalUSD = usd + (usd * vat / 100);
	let totalBHD = totalUSD * 0.376;
	document.getElementById("totalusd").value = totalUSD.toFixed(2);
	document.getElementById("totalbhd").value = totalBHD.toFixed(3);
}
function saveData() {
	calculate();
	const data = {
        Department: document/getElementById("Department").value,
    	item: document.getElementById("item").value,
    	usd: document.getElementById("usd").value,
    	vat: document.getElementById("vat").value,
    	totalUSD: document.getElementById("totalusd").value,
    	totalBHD: document.getElementById("totalbhd").value
}};

document.getElementById("studentForm").addEventListener("submit", function(e) {

  method: "POST",
  mode: "no-cors",
  body: JSON.stringify({
  })

.then(() => {
  document.getElementById("result").innerHTML =
    "✅ Submitted";

.catch(error => {
  document.getElementById("result").innerHTML =
    "❌ " + error;
});
});


</script>

</body>
</html>
