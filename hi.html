<!DOCTYPE html>
<html>
<head>
<title>Procurement Form</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:20px;
}

table{
    border-collapse:collapse;
}

td{
    padding:8px;
}

input{
    padding:8px;
    width:250px;
}

button{
    padding:10px 15px;
    margin-right:10px;
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:darkgreen;
}
</style>

</head>
<body>

<h2>Procurement Request</h2>

<table>

<tr>
<td>Item Name</td>
<td><input type="text" id="item"></td>
</tr>

<tr>
<td>USD Price</td>
<td><input type="number" id="usd"></td>
</tr>

<tr>
<td>VAT %</td>
<td><input type="number" id="vat" value="10"></td>
</tr>

<tr>
<td>Total USD</td>
<td><input type="text" id="totalusd" readonly></td>
</tr>

<tr>
<td>Total BHD</td>
<td><input type="text" id="totalbhd" readonly></td>
</tr>

</table>

<br>

<button onclick="calculate()">Calculate</button>
<button onclick="saveData()">Save</button>

<script>

function calculate(){

    let usd = parseFloat(document.getElementById("usd").value) || 0;
    let vat = parseFloat(document.getElementById("vat").value) || 0;

    let totalUSD = usd + (usd * vat / 100);
    let totalBHD = totalUSD * 0.376;

    document.getElementById("totalusd").value = totalUSD.toFixed(2);
    document.getElementById("totalbhd").value = totalBHD.toFixed(3);
}

function saveData(){

    calculate();

    const data = {

        item: document.getElementById("item").value,
        usd: document.getElementById("usd").value,
        vat: document.getElementById("vat").value,
        totalUSD: document.getElementById("totalusd").value,
        totalBHD: document.getElementById("totalbhd").value

    };

    fetch("https://script.google.com/macros/s/AKfycbxo5C6MZkuaCOTLi29SbCQM_aURUZ2IW9xGWSsEXBTu038f4ebssnjCgowivTjtOFWOSw/exec", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
    })
    .then(response => response.text())
    .then(result => {
        console.log(result);
        alert("Saved Successfully");
    })
    .catch(error => {
        console.error(error);
        alert("Error Saving Data");
    });

}
</script>

</body>
</html>
