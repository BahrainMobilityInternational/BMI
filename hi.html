<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>
<body>

<h2>Student Registration</h2>

<form id="studentForm">
    <input type="text" id="requester" placeholder="Requester Name">
<input type="text" id="department" placeholder="Department">
<input type="text" id="item" placeholder="Item Name">
<input type="number" id="quantity" placeholder="Quantity">
<input type="number" id="price" placeholder="Price USD">
    <input type="text" id="name" placeholder="Name" required>
    <br><br>

    <input type="number" id="age" placeholder="Age" required>
    <br><br>

    <button type="submit">Save</button>
</form>

<p id="result"></p>

<script>
document.getElementById("studentForm").addEventListener("submit", function(e) {
    e.preventDefault();

   fetch("https://script.google.com/macros/s/AKfycbyMmexf3ODHld00RbjPCtqgE5tmNHFd-7b4Q63aAFN42YOsNYd4tP0MnTCMh2qXbZ9N/exec", {
  method: "POST",
  mode: "no-cors",
  body: JSON.stringify({
    requester: document.getElementById("requester").value,
    department: document.getElementById("department").value,
    item: document.getElementById("item").value,
    quantity: document.getElementById("quantity").value,
    price: document.getElementById("price").value,
    name: document.getElementById("").value,
    age: document.getElementById("").value
  })
})
.then(() => {
  document.getElementById("result").innerHTML =
    "✅ Submitted";
})
.catch(error => {
  document.getElementById("result").innerHTML =
    "❌ " + error;
});
});
</script>

</body>
</html>
